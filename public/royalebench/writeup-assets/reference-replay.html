<style>
:root { color-scheme:dark; --blue:#78b5ff; --red:#f58d79; --ink:#e8edf7; --muted:#a5b2c9;
  --bg:#0e1420; --surface:#172033; --panel:#1f2b44; --line:#354563; --elixir:#e18deb; }
* { box-sizing: border-box; }
body { margin:0; font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink); background:var(--bg); }
header { display:flex; align-items:baseline; gap:12px; padding:8px 14px; background:var(--surface);
  border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:15px; margin:0; }
header .meta { color:var(--muted); font-size:12px; }
#warn { display:none; background:#342b19; color:#f3d28a; border-bottom:1px solid #725b2d;
  padding:6px 14px; }
main { display:flex; gap:12px; padding:10px 14px; align-items:flex-start; }
.team-panels { width:190px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; }
.side { width:190px; background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:10px; }
.side h2 { margin:0 0 6px; font-size:14px; display:flex; justify-content:space-between; }
.side.blue h2 { color:var(--blue); } .side.red h2 { color:var(--red); }
.bar { height:10px; background:var(--panel); border-radius:5px; overflow:hidden; margin:3px 0 8px; }
.bar > div { height:100%; background:#c44fd6; }
.hand { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:3px 5px;
  font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card b { float:right; color:var(--elixir); }
.kv { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
.kv span:last-child { color:var(--ink); font-variant-numeric:tabular-nums; }
#boardwrap { flex:1 1 360px; min-width:260px; display:flex; flex-direction:column;
  align-items:center; }
canvas { background:#7fb35b; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.25);
  touch-action:none; }
#controls { display:flex; gap:8px; align-items:center; width:100%; max-width:760px;
  margin-top:8px; flex-wrap:wrap; }
#controls button, #speed { font:inherit; color:var(--ink); padding:4px 10px;
  border:1px solid var(--line); background:var(--surface); border-radius:5px; cursor:pointer; }
#controls button { min-width:34px; }
#controls button:hover, #speed:hover { background:var(--panel); }
#controls :focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
#controls input { accent-color:var(--blue); }
#scrub { flex:1 1 240px; cursor:pointer; }
#clock { font-variant-numeric:tabular-nums; min-width:150px; text-align:right; }
#result { margin-top:6px; font-weight:600; min-height:18px; }
#tip { position:fixed; pointer-events:none; background:rgba(14,20,32,.96); color:var(--ink);
  padding:5px 7px; border:1px solid var(--line); border-radius:5px; font-size:12px; display:none; white-space:pre;
  z-index:5; }
footer { color:var(--muted); font-size:11px; padding:4px 14px 12px; }
.legend { display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--muted);
  margin-top:6px; }
.sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:3px;
  vertical-align:-1px; }
.decision-panel { width:300px; flex-shrink:0; min-width:0; padding:12px; border:1px solid var(--line);
  border-radius:8px; background:var(--surface); }
.decision-panel h2 { margin:0 0 6px; font-size:14px; }
.decision-panel .note { color:var(--muted); font-size:11px; margin:0 0 12px; }
#decision-body { max-height:calc(100vh - 150px); overflow:auto; overflow-wrap:anywhere; }
.decision-panel h3 { font-size:12px; margin:0 0 10px; color:var(--blue); }
.decision-panel h3.red { color:var(--red); }
.decision-step + .decision-step { margin-top:10px; }
.decision-step .kind { display:block; color:var(--muted); font-size:11px; margin-bottom:4px; }
.decision-panel pre { font:12px/1.5 ui-monospace,"SF Mono",Consolas,monospace; white-space:pre-wrap;
  overflow-wrap:anywhere; margin:0; }
.decision-step pre { padding:8px; background:var(--bg); border-radius:5px; }
.decision-panel summary { cursor:pointer; color:var(--muted); font-size:12px; padding:4px 0; }
.decision-panel :focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
.decision-history { margin-top:14px; border-top:1px solid var(--line); padding-top:8px; }
.decision-history article { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
.decision-count { color:var(--muted); font-size:11px; margin:0 0 10px; }
@media (max-width:1100px) {
  .team-panels, .side { width:150px; }
  .decision-panel { width:260px; }
}
@media (max-width:850px) {
  main { flex-wrap:wrap; }
  .team-panels { order:1; width:100%; flex-direction:row; }
  .side { flex:1; }
  #boardwrap { flex:1 1 260px; }
  .decision-panel { flex:1 1 240px; }
}
@media (max-width:700px) {
  main { flex-direction:column; align-items:center; padding:8px; }
  #boardwrap { order:-1; flex:0 0 auto; min-width:0; width:100%; }
  .team-panels { flex-direction:column; }
  .side { width:100%; }
  .decision-panel { width:100%; flex:0 0 auto; }
  #decision-body { max-height:420px; }
}
</style>

    else if (k === "ArrowLeft") { playing = false; seek(cur - 1); }
    else if (k === "ArrowRight") { playing = false; seek(cur + 1); }
    else if (k === "Home") { playing = false; seek(0); }
    else if (k === "End") { playing = false; seek(N - 1); }
  });
  cv.addEventListener("mousemove", function (e) {
    var b = cv.getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top;
    var hit = null;
    for (var i = drawn.length - 1; i >= 0; i--) {
      var d = drawn[i], dx = mx - d.p[0], dy = my - d.p[1];
      if (dx * dx + dy * dy <= Math.max(d.rad, 6) * Math.max(d.rad, 6)) { hit = d; break; }
    }
    if (!hit) { tip.style.display = "none"; return; }
    if (hit.spell) {
      var q = hit.spell, mname = Object.keys(MOTION).filter(function (k) {
        return MOTION[k] === q[SF.motion];
      })[0];
      var mtext = mname === undefined ? "motion " + q[SF.motion] : mname.toLowerCase();
      tip.textContent = cardName(q[SF.card_id]) + "  (" + NAMES[q[SF.team]] + " spell, " +
        mtext + ")\ntile (" + (q[SF.x] / S).toFixed(2) + ", " +
        (q[SF.y] / S).toFixed(2) + ")\naim (" + (q[SF.aim_x] / S).toFixed(2) + ", " +
        (q[SF.aim_y] / S).toFixed(2) + ")" +
        (SF.delay_ticks !== undefined && q[SF.delay_ticks] > 0 ?
          "\ndelay " + q[SF.delay_ticks] + " ticks" : "") +
        (SF.length !== undefined && q[SF.length] > 0 ? "\nrolled " +
          (q[SF.travelled] / S).toFixed(2) + " / " + (q[SF.length] / S).toFixed(2) +
          " tiles, " + q[SF.hits] + " hit" : "");
      tip.style.display = "block";
      tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 10) + "px";
      return;
    }
    hit = hit.r;
    var kindName = Object.keys(KIND).filter(function (k) { return KIND[k] === hit[EF.kind]; })[0];
    tip.textContent = (cardName(hit[EF.card_id]) || kindName) + "  (" + NAMES[hit[EF.team]] +
      ", uid " + hit[EF.uid] + ")\nhp " + hit[EF.hp] + " / " + hit[EF.max_hp] +
      (EF.shield !== undefined && hit[EF.shield] > 0 ? "\nshield " + hit[EF.shield] : "") +
      "\ntile (" + (hit[EF.x] / S).toFixed(2) + ", " + (hit[EF.y] / S).toFixed(2) + ")" +
      "\nradius " + (hit[EF.radius] / S).toFixed(3) + " tiles" +
      (hit[EF.flying] ? "\nflying" : "") +
      (hit[EF.deploy_ticks] > 0 ? "\ndeploying: " + hit[EF.deploy_ticks] + " ticks left" : "") +
      (EF.stun_ticks !== undefined && hit[EF.stun_ticks] > 0 ?
        "\nstunned: " + hit[EF.stun_ticks] + " ticks left" : "") +
      (EF.knockback_ticks !== undefined && hit[EF.knockback_ticks] > 0 ?
        "\nknockback: " + hit[EF.knockback_ticks] + " ticks left" : "");
    tip.style.display = "block";
    tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 10) + "px";
  });
  cv.addEventListener("mouseleave", function () { tip.style.display = "none"; });

  var src = D.source;
  document.getElementById("meta").textContent = "seed " + src.seed + " | " + N + " frames" +
    (src.stride > 1 ? " (every " + src.stride + " of " + src.frames_recorded + ")" : "") +
    " | " + (src.frame_every_tick ? "every tick" : "one frame per decision") +
    " | tick " + TICK_MS + " ms | " + D.deploys.length + " deploy commands";
  if (D.warnings.length) {
    var warn = document.getElementById("warn");
    warn.style.display = "block";
    warn.textContent = "Warning: " + D.warnings.join(" | ");
  }
  document.getElementById("foot").textContent = "trace " + src.trace_format + " v" +
    src.trace_version + " | arena vintage: " + src.arena_vintage +
    " | positions are recorded engine state; interpolation, when on, is a straight-line guess" +
    " | Clash Royale data is evidence, not spec";
  layout();
  if (writeupEmbedded) parent.postMessage({type:'royalebench-ready'}, writeupTargetOrigin);
  window.requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
